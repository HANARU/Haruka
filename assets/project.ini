# Haruka project settings (part of the project, version-controlled).
# Lines are name = value. Paths are logical paths under assets/.
# Read once at startup; restart the editor after editing.

# Scene opened at startup. The editor opens the scene you had open last time instead, if it still exists
# (Config/editor_state.txt in the run folder).
startScene = assets/scenes/LightingProbe.hscene

# XR rig height (used by the invisible rig the engine places under the camera in scenes without an XR Rig;
# an XR Rig placed in the scene uses its own Height / Eye Height values).
#   xr.height = tracked   real height from the headset's floor (OpenXR LOCAL_FLOOR)
#   xr.height = fixed     eyes always at xr.eyeHeight above the floor, sitting or standing
#   xr.eyeHeight          meters from the floor to the eyes (0.5 - 2.5); also used when the runtime has no floor space
xr.height = tracked
xr.eyeHeight = 1.7

# Start the game executable (HarukaGame) in VR. The command line --xr / --no-xr overrides this.
# The editor ignores it and prepares VR only with --xr.
xr.startInVr = false

# Input bindings (game actions and axes). Sources, comma separated:
#   actions: key:W  key:Space  key:F1  xr:left.x  xr:left.y  xr:right.a  xr:right.b  xr:left.grip  xr:right.trigger ...
#   axes:    keys:W/S (positive/negative)  xr:left.stick.x  xr:right.stick.y  xr:left.trigger  mouse:x  mouse:y*0.5
# Mouse axes read the right-button drag in the viewport during Play.
input.axis.MoveX = keys:D/A, xr:left.stick.x
input.axis.MoveY = keys:W/S, xr:left.stick.y
input.axis.MoveUp = keys:E/Q
input.axis.TurnX = xr:right.stick.x
input.axis.LookX = mouse:x
input.axis.LookY = mouse:y
input.action.GrabLeft = xr:left.grip
input.action.GrabRight = xr:right.grip
